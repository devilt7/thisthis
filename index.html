<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>香港兩餸霸王 - HK This-This Rice King</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 經典港式霓虹字與牌坊招牌 */
    .neon-text-red {
      text-shadow: 0 0 5px #ff2a2a, 0 0 12px #ff0055, 0 0 25px #ff0055;
    }
    .neon-text-yellow {
      text-shadow: 0 0 5px #ffe600, 0 0 15px #ff9900;
    }
    .neon-border {
      box-shadow: 0 0 10px rgba(255, 30, 86, 0.6), inset 0 0 10px rgba(255, 30, 86, 0.4);
    }

    /* 不銹鋼保溫盤質感 */
    .tray-metal {
      background: linear-gradient(145deg, #d8dee9, #8892b0);
      box-shadow: inset 2px 2px 5px rgba(255,255,255,0.8), inset -2px -2px 5px rgba(0,0,0,0.4), 0 4px 6px rgba(0,0,0,0.3);
    }
    .tray-active {
      transform: scale(0.96);
      filter: brightness(0.9);
    }

    /* 蒸氣熱氣飄揚動畫 */
    @keyframes steam {
      0% { transform: translateY(0) scaleX(0.8); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-16px) scaleX(1.3); opacity: 0; }
    }
    .steam-effect::after {
      content: "♨️";
      position: absolute;
      top: -12px;
      left: 45%;
      font-size: 14px;
      animation: steam 2s infinite ease-out;
      pointer-events: none;
    }

    /* 飄字金幣/扣分特效 */
    @keyframes floatUpFade {
      0% { transform: translate(-50%, 0); opacity: 1; }
      100% { transform: translate(-50%, -40px); opacity: 0; }
    }
    .floating-feedback {
      position: fixed;
      animation: floatUpFade 1s forwards ease-out;
      pointer-events: none;
      font-weight: 900;
      z-index: 99;
    }

    /* 客人抖動憤怒動畫 */
    @keyframes angerShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px) rotate(-1deg); }
      40% { transform: translateX(4px) rotate(1deg); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    .angry-shake {
      animation: angerShake 0.4s infinite;
    }

    /* 對話氣泡倒三角 */
    .bubble-arrow::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 28px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }
  </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen flex flex-col justify-between items-center p-2 sm:p-4 overflow-x-hidden">

  <!-- 頂部資訊欄：招牌、資金、日數、倒數 -->
  <header class="w-full max-w-4xl bg-stone-800/90 border-2 border-red-600 rounded-xl p-3 shadow-lg flex flex-wrap justify-between items-center gap-2 mb-2 neon-border">
    <div class="flex items-center gap-3">
      <div class="bg-red-700 text-yellow-300 font-black px-3 py-1 rounded-md text-xl tracking-wider border-2 border-yellow-400 neon-text-yellow">
        興旺兩餸飯
      </div>
      <div>
        <span class="text-xs text-stone-400 block font-semibold">營業日</span>
        <span id="day-counter" class="text-lg font-black text-amber-400">第 1 日</span>
      </div>
    </div>

    <div class="flex items-center gap-4 text-sm sm:text-base">
      <div class="text-right">
        <span class="text-xs text-stone-400 block font-semibold">今日營收 / 成本</span>
        <span class="font-bold text-green-400">$<span id="daily-revenue">0</span></span>
        <span class="text-stone-400">/ $<span id="daily-cost">180</span></span>
      </div>

      <div class="bg-stone-900 px-3 py-1.5 rounded-lg border border-stone-700">
        <span class="text-xs text-stone-400 block">累積資金</span>
        <span class="text-xl font-black text-yellow-400 font-mono">$<span id="total-cash">200</span></span>
      </div>

      <div class="bg-red-950/80 px-3 py-1 rounded-lg border border-red-500 text-center min-w-[70px]">
        <span class="text-xs text-red-300 block font-semibold">打烊剩餘</span>
        <span id="timer" class="text-xl font-black text-white font-mono">60s</span>
      </div>
    </div>
  </header>

  <!-- 遊戲主體視窗 -->
  <main class="w-full max-w-4xl flex-1 flex flex-col justify-between gap-3 relative">
    
    <!-- 顧客等候區 (排隊) -->
    <section class="bg-stone-800/70 rounded-xl p-3 border border-stone-700 min-h-[170px] flex flex-col justify-between relative shadow-inner">
      <div class="flex justify-between items-center text-xs text-stone-400 font-bold mb-1">
        <span>👨‍👩‍👧‍👦 排隊客人 (<span id="queue-count">0</span> 人等候中)</span>
        <span class="text-amber-400" id="tip-indicator">💡 貼士：出餐要快，客人才會比貼士！</span>
      </div>

      <!-- 客人佇列展示 -->
      <div id="customer-stage" class="flex items-end gap-3 sm:gap-6 overflow-x-auto pb-1 pt-1 min-h-[120px] px-2">
        <!-- 動態注入排隊客人與對話框 -->
      </div>
    </section>

    <!-- 保溫熟食櫃 (十款餸菜金屬盤) -->
    <section class="bg-neutral-800 rounded-xl p-3 border-2 border-stone-600 shadow-xl">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-sm font-black tracking-wide text-yellow-400 flex items-center gap-1.5">
          <span>🥘 每日十款新鮮熱辣餸菜</span>
          <span class="text-xs text-stone-300 font-normal">(點擊選擇盛入飯盒)</span>
        </h2>
        <!-- 送例湯功能按鈕 -->
        <button id="soup-btn" onclick="serveFreeSoup()" class="bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-white font-bold text-xs py-1 px-3 rounded-full shadow border border-yellow-300 active:scale-95 transition-transform flex items-center gap-1">
          <span>🥣 送例湯給客人 (+耐心)</span>
          <span id="soup-cooldown" class="text-yellow-200"></span>
        </button>
      </div>

      <div id="dishes-grid" class="grid grid-cols-2 sm:grid-cols-5 gap-2 sm:gap-3">
        <!-- 動態注入10款當日餸菜按鈕 -->
      </div>
    </section>

    <!-- 打包操作檯 (外賣飯盒與按鈕) -->
    <section class="bg-stone-800/90 rounded-xl p-3 border border-stone-700 flex flex-wrap items-center justify-between gap-3 shadow-md">
      <!-- 外賣發泡膠飯盒展示區 -->
      <div class="flex items-center gap-3 flex-1 min-w-[260px]">
        <div class="bg-stone-100 text-stone-900 border-2 border-dashed border-stone-400 rounded-lg p-2.5 w-full flex items-center justify-between shadow-inner">
          <div class="flex items-center gap-2">
            <span class="text-2xl">🍚</span>
            <div class="text-xs">
              <p class="font-black text-stone-800" id="box-status-title">外賣發泡膠盒 (白飯底)</p>
              <p class="text-stone-500 text-[11px]" id="box-status-desc">請點擊上方餸菜盛入</p>
            </div>
          </div>
          <!-- 盛入的餸菜標籤清單 -->
          <div id="packed-dishes-container" class="flex gap-1.5 flex-wrap justify-end">
            <span class="text-stone-400 text-xs italic px-2 py-1">尚未夾餸...</span>
          </div>
        </div>
      </div>

      <!-- 操作按鈕群 -->
      <div class="flex items-center gap-2">
        <button onclick="trashBox()" class="bg-stone-700 hover:bg-stone-600 active:scale-95 text-stone-200 font-bold px-3 py-2.5 rounded-lg text-sm border border-stone-500 transition-colors flex items-center gap-1">
          <span>🗑️ 倒咗佢</span>
          <span class="text-stone-400 text-xs">(清空)</span>
        </button>

        <button onclick="submitMeal()" class="bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-yellow-300 font-black text-base px-6 py-2.5 rounded-lg shadow-lg border-2 border-yellow-400 active:scale-95 transition-all flex items-center gap-1.5 neon-text-yellow">
          <span>🥡 遞餐！</span>
        </button>
      </div>
    </section>

  </main>

  <!-- 頁尾版權與介紹 -->
  <footer class="w-full max-w-4xl text-center text-xs text-stone-500 mt-2">
    香港兩餸飯文化 - 平靚正的街坊之選 | 支援手機觸控及電腦滑鼠操作
  </footer>

  <!-- 每日結算彈窗 (Daily Summary Modal) -->
  <div id="summary-modal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-stone-800 border-2 border-yellow-400 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl relative">
      <h2 id="summary-title" class="text-3xl font-black text-yellow-400 mb-1 neon-text-yellow">今日打烊結算</h2>
      <p id="summary-subtitle" class="text-stone-300 text-sm mb-4">辛苦晒！睇下今日跑成點！</p>

      <div class="bg-stone-900 rounded-xl p-4 mb-5 text-left border border-stone-700 font-mono text-sm space-y-2">
        <div class="flex justify-between">
          <span class="text-stone-400">客流量：</span>
          <span class="font-bold text-white"><span id="sum-customers-served">0</span> 位 (滿意)</span>
        </div>
        <div class="flex justify-between">
          <span class="text-stone-400">總營業額：</span>
          <span class="font-bold text-green-400">+$<span id="sum-revenue">0</span></span>
        </div>
        <div class="flex justify-between">
          <span class="text-stone-400">舖租、水電及食材成本：</span>
          <span class="font-bold text-red-400">-$<span id="sum-cost">0</span></span>
        </div>
        <hr class="border-stone-700 my-2">
        <div class="flex justify-between text-base">
          <span class="font-bold text-stone-300">今日純利：</span>
          <span id="sum-net-profit" class="font-black text-yellow-400">$0</span>
        </div>
        <div class="flex justify-between text-lg">
          <span class="font-bold text-stone-200">結餘累積資金：</span>
          <span id="sum-total-cash" class="font-black text-yellow-300">$0</span>
        </div>
      </div>

      <div id="summary-status-msg" class="text-sm font-bold text-stone-300 mb-5 min-h-[24px]"></div>

      <button id="next-day-btn" onclick="startNextDay()" class="w-full bg-red-600 hover:bg-red-500 text-yellow-300 font-black py-3 rounded-xl text-lg shadow-lg border-2 border-yellow-400 transition-transform active:scale-95">
        開展下一天 ➡️
      </button>
      <button id="restart-btn" onclick="restartEntireGame()" class="hidden w-full bg-stone-700 hover:bg-stone-600 text-white font-bold py-3 rounded-xl text-lg transition-transform active:scale-95">
        重頭再嚟 🔄
      </button>
    </div>
  </div>

  <script>
    /* ========================================================
       1. 遊戲資料庫 (16 款港式名物餸菜池)
       ======================================================== */
    const ALL_DISHES_POOL = [
      { id: "gulu_meat", name: "咕嚕肉", icon: "🍖", tag: "招牌" },
      { id: "salt_pepper_pork", name: "椒鹽豬扒", icon: "🥩", tag: "人氣" },
      { id: "tomato_egg", name: "番茄炒蛋", icon: "🍳", tag: "經典" },
      { id: "mapo_tofu", name: "麻婆豆腐", icon: "🍲", tag: "惹味" },
      { id: "squid_broccoli", name: "西蘭花炒魷", icon: "🥦", tag: "鮮味" },
      { id: "eggplant", name: "魚香茄子", icon: "🍆", tag: "送飯" },
      { id: "clam_bean", name: "豉椒炒蜆", icon: "🐚", tag: "香口" },
      { id: "corn_fish", name: "粟米斑塊", icon: "🐟", tag: "必叫" },
      { id: "beef_potato", name: "黑椒薯仔牛", icon: "🥔", tag: "極品" },
      { id: "curry_beef", name: "咖喱牛腩", icon: "🍛", tag: "濃郁" },
      { id: "steam_pork", name: "土匪蒸肉餅", icon: "🍘", tag: "家常" },
      { id: "lettuce", name: "蒜蓉生菜", icon: "🥬", tag: "健康" },
      { id: "chicken_leg", name: "滷水雞髀", icon: "🍗", tag: "大份" },
      { id: "onion_pork", name: "洋蔥豬扒", icon: "🧅", tag: "香甜" },
      { id: "egg_pork", name: "鹹蛋蒸肉餅", icon: "🥚", tag: "傳統" },
      { id: "spicy_chicken", name: "四川辣子雞", icon: "🌶️", tag: "麻辣" }
    ];

    // 客人外觀與稱呼池
    const CUSTOMER_TYPES = [
      { role: "地盤師傅", avatar: "👷‍♂️", defaultPatience: 45, lines: ["師傅，快手！趕住返地盤！", "要多汁！唔該！"] },
      { role: "中環OL", avatar: "👩‍💼", defaultPatience: 35, lines: ["唔該飯少，要多兩條西蘭花。", "快少少呀，就遲到！"] },
      { role: "慈祥師奶", avatar: "👵", defaultPatience: 50, lines: ["多汁吖靚仔，今晚唔使煮。", "啲菜新唔新鮮㗎？"] },
      { role: "中學男生", avatar: "👦", defaultPatience: 40, lines: ["師傅，要多飯！裝滿佢！", "肉餅有冇得揀肥啲？"] },
      { role: "的士阿叔", avatar: "🚕", defaultPatience: 32, lines: ["抄緊牌呀！快快手裝盒！", "例湯咩嚟㗎？"] },
      { role: "大學生", avatar: "🎒", defaultPatience: 38, lines: ["今日又有粟米斑塊，正！", "兩餸飯係窮人恩物～"] }
    ];

    const CANTONESE_ANGRY_VOICES = [
      "咁耐㗎！唔等喇！",
      "執笠啦你！",
      "趕時間呀，幫襯第二間算！",
      "等咁耐白飯都凍晒啦！"
    ];

    /* ========================================================
       2. Web Audio API 音效合成引擎 (零依賴外置音樂)
       ======================================================== */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 播放音效
    function playSfx(type) {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'scoop') {
          // 夾餸盛入盤聲 (清脆金屬敲擊聲)
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.1);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'cash') {
          // 收銀機叮噹清脆音
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987.77, now); // B5
          osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'soup') {
          // 舀湯水波聲
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.linearRampToValueAtTime(650, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'trash') {
          // 倒掉失誤聲 (下行鈍音)
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'angry') {
          // 客人生氣不滿聲
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.setValueAtTime(120, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      } catch (e) {
        console.error("Audio error: ", e);
      }
    }

    /* ========================================================
       3. 核心遊戲狀態
       ======================================================== */
    let currentDay = 1;
    let totalCash = 200; // 啟動資本 $200
    let dailyRevenue = 0;
    let dailyCost = 180; // 第一天成本
    let timeLeft = 60;
    let timerInterval = null;
    let isDayActive = false;

    let todaysDishes = []; // 當天10款可選餸菜
    let customerQueue = []; // 排隊隊列
    let currentBoxDishes = []; // 玩家目前飯盒內的餸菜
    let satisfiedCount = 0; // 今日招待人數
    let soupCooldownRemaining = 0;

    /* ========================================================
       4. 每日開局與餸菜隨機配置
       ======================================================== */
    function initializeDay() {
      timeLeft = 60;
      dailyRevenue = 0;
      satisfiedCount = 0;
      currentBoxDishes = [];
      customerQueue = [];
      soupCooldownRemaining = 0;

      // 每日成本遞增 (房租、貴食材)
      dailyCost = 180 + (currentDay - 1) * 85;

      // 更新介面
      document.getElementById('day-counter').innerText = `第 ${currentDay} 日`;
      document.getElementById('daily-revenue').innerText = dailyRevenue;
      document.getElementById('daily-cost').innerText = dailyCost;
      document.getElementById('total-cash').innerText = totalCash;
      document.getElementById('timer').innerText = `${timeLeft}s`;
      renderPackedBox();

      // 從 16 款餸菜隨機抽出 10 款
      const shuffled = [...ALL_DISHES_POOL].sort(() => 0.5 - Math.random());
      todaysDishes = shuffled.slice(0, 10);
      renderDishTrays();

      // 初始化隊列（預先排 3 位客人）
      for (let i = 0; i < 3; i++) {
        spawnCustomer();
      }
      renderQueue();

      // 開始計時器
      isDayActive = true;
      clearInterval(timerInterval);
      timerInterval = setInterval(gameTick, 1000);
    }

    // 渲染今日 10 款餸菜金屬盤
    function renderDishTrays() {
      const grid = document.getElementById('dishes-grid');
      grid.innerHTML = '';

      todaysDishes.forEach((dish) => {
        const btn = document.createElement('button');
        btn.className = "tray-metal steam-effect relative rounded-xl p-2 sm:p-2.5 flex flex-col items-center justify-between transition active:scale-95 text-stone-900 border border-stone-400 hover:border-yellow-400 group cursor-pointer";
        btn.onclick = () => addDishToBox(dish);
        btn.innerHTML = `
          <div class="flex items-center justify-between w-full text-[10px] font-bold text-stone-700 px-0.5">
            <span class="bg-amber-300/80 px-1 rounded text-red-900">${dish.tag}</span>
            <span class="text-stone-600 font-mono">保溫中</span>
          </div>
          <div class="text-2xl sm:text-3xl my-0.5 group-hover:scale-110 transition-transform">${dish.icon}</div>
          <div class="font-black text-xs sm:text-sm text-stone-900 tracking-tight leading-tight text-center">${dish.name}</div>
        `;
        grid.appendChild(btn);
      });
    }

    /* ========================================================
       5. 客人隊列與訂單生成邏輯
       ======================================================== */
    function spawnCustomer() {
      if (customerQueue.length >= 4) return;

      const randomType = CUSTOMER_TYPES[Math.floor(Math.random() * CUSTOMER_TYPES.length)];
      
      // 第三天起有 45% 機率點「三餸飯」，否則為「兩餸飯」
      const isThreeDishes = (currentDay >= 3 && Math.random() < 0.45);
      const dishCount = isThreeDishes ? 3 : 2;
      const mealPrice = isThreeDishes ? 48 : 38;

      // 從今日 10 款中挑選不重複的餸
      const shuffled = [...todaysDishes].sort(() => 0.5 - Math.random());
      const orderedDishes = shuffled.slice(0, dishCount);

      // 客人耐心值隨著天數略微加快考驗玩家反應
      const speedFactor = Math.max(0.65, 1 - (currentDay - 1) * 0.05);
      const totalPatience = Math.round(randomType.defaultPatience * speedFactor);

      const customer = {
        id: Date.now() + Math.random(),
        role: randomType.role,
        avatar: randomType.avatar,
        dialogue: randomType.lines[Math.floor(Math.random() * randomType.lines.length)],
        isThreeDishes: isThreeDishes,
        dishCount: dishCount,
        price: mealPrice,
        wantedDishes: orderedDishes,
        maxPatience: totalPatience,
        currentPatience: totalPatience,
        isAngry: false
      };

      customerQueue.push(customer);
    }

    // 渲染客人隊列視覺
    function renderQueue() {
      const container = document.getElementById('customer-stage');
      const queueCountText = document.getElementById('queue-count');
      queueCountText.innerText = customerQueue.length;
      container.innerHTML = '';

      if (customerQueue.length === 0) {
        container.innerHTML = `<div class="text-stone-500 text-sm italic py-8 text-center w-full">暫時冇客人，等一陣就會有人嚟幫襯...</div>`;
        return;
      }

      customerQueue.forEach((cust, index) => {
        const isCurrent = index === 0; // 最前方接待中的客人
        const patiencePercent = Math.max(0, (cust.currentPatience / cust.maxPatience) * 100);
        let barColor = "bg-green-500";
        if (patiencePercent < 50) barColor = "bg-yellow-500";
        if (patiencePercent < 25) barColor = "bg-red-500";

        const custWrapper = document.createElement('div');
        custWrapper.className = `flex flex-col items-center relative transition-all ${isCurrent ? 'scale-105 z-20' : 'opacity-70 scale-95 z-10'}`;

        // 當前客人的點餐指示對話框
        let speechBubbleHTML = '';
        if (isCurrent) {
          speechBubbleHTML = `
            <div class="bg-white text-stone-900 rounded-xl p-2 shadow-xl border-2 border-amber-400 mb-2 relative bubble-arrow max-w-[240px]">
              <div class="flex items-center justify-between border-b border-stone-200 pb-1 mb-1.5">
                <span class="font-black text-xs text-red-600 bg-red-100 px-1.5 py-0.5 rounded">
                  ${cust.isThreeDishes ? '三餸飯 ($48)' : '兩餸飯 ($38)'}
                </span>
                <span class="text-[10px] text-stone-500 font-bold">${cust.role}</span>
              </div>
              <div class="text-xs font-bold text-stone-800 mb-1 leading-snug">
                「我要：<span class="text-red-700">${cust.wantedDishes.map(d => d.name).join('、')}</span>！」
              </div>
              <!-- 圖標輔助辨別 -->
              <div class="flex gap-1">
                ${cust.wantedDishes.map(d => `<span class="bg-stone-100 px-1.5 py-0.5 rounded text-xs border border-stone-300 font-medium">${d.icon} ${d.name}</span>`).join('')}
              </div>
            </div>
          `;
        }

        custWrapper.innerHTML = `
          ${speechBubbleHTML}
          <div class="relative flex flex-col items-center">
            <!-- 耐心條 -->
            <div class="w-16 sm:w-20 bg-stone-900 rounded-full h-2 overflow-hidden border border-stone-600 mb-1">
              <div class="h-full transition-all duration-300 ${barColor}" style="width: ${patiencePercent}%"></div>
            </div>
            <!-- 人物頭像 -->
            <div class="text-4xl sm:text-5xl ${cust.isAngry ? 'angry-shake' : ''} filter drop-shadow">
              ${cust.avatar}
            </div>
            <div class="text-[11px] font-bold text-stone-300 bg-stone-900/90 px-1.5 py-0.5 rounded-md mt-0.5">
              ${cust.role}
            </div>
          </div>
        `;

        container.appendChild(custWrapper);
      });
    }

    /* ========================================================
       6. 玩家夾餸與裝盒交互
       ======================================================== */
    function addDishToBox(dish) {
      if (!isDayActive) return;

      const currentCust = customerQueue[0];
      const maxAllowed = currentCust ? currentCust.dishCount : 3;

      if (currentBoxDishes.length >= maxAllowed) {
        showFloatingText("飯盒已經裝滿咗啦！請按「遞餐」！", "text-amber-400");
        return;
      }

      currentBoxDishes.push(dish);
      playSfx('scoop');
      renderPackedBox();
    }

    // 倒咗佢 (重新夾過)
    function trashBox() {
      if (currentBoxDishes.length === 0) return;
      currentBoxDishes = [];
      playSfx('trash');
      showFloatingText("已倒掉重裝 🗑️", "text-stone-300");
      renderPackedBox();
    }

    // 渲染飯盒盛裝進度
    function renderPackedBox() {
      const container = document.getElementById('packed-dishes-container');
      const title = document.getElementById('box-status-title');
      const desc = document.getElementById('box-status-desc');

      const currentCust = customerQueue[0];
      const targetCount = currentCust ? currentCust.dishCount : 2;

      title.innerText = `外賣發泡膠盒 (${currentBoxDishes.length} / ${targetCount} 餸)`;

      if (currentBoxDishes.length === 0) {
        container.innerHTML = `<span class="text-stone-400 text-xs italic px-2 py-1">尚未夾餸...</span>`;
        desc.innerText = "請點擊上方餸菜盛入";
        return;
      }

      desc.innerText = "已盛裝餸菜：";
      container.innerHTML = '';
      currentBoxDishes.forEach((d, idx) => {
        const tag = document.createElement('span');
        tag.className = "bg-amber-100 text-stone-900 text-xs font-black px-2 py-1 rounded-md border border-amber-300 flex items-center gap-1 shadow-sm";
        tag.innerHTML = `<span>${d.icon}</span> <span>${d.name}</span>`;
        container.appendChild(tag);
      });
    }

    /* ========================================================
       7. 出餐核對判定
       ======================================================== */
    function submitMeal() {
      if (!isDayActive) return;

      if (customerQueue.length === 0) {
        showFloatingText("目前冇客人等緊！", "text-stone-400");
        return;
      }

      const cust = customerQueue[0];

      // 檢查件數是否滿足
      if (currentBoxDishes.length < cust.dishCount) {
        showFloatingText(`仲差 ${cust.dishCount - currentBoxDishes.length} 個餸未夾齊！`, "text-amber-400");
        return;
      }

      // 核對菜式是否完全吻合 (不分順序)
      const wantedIds = cust.wantedDishes.map(d => d.id).sort();
      const packedIds = currentBoxDishes.map(d => d.id).sort();

      const isCorrect = wantedIds.length === packedIds.length && wantedIds.every((id, idx) => id === packedIds[idx]);

      if (isCorrect) {
        // 出餐正確！計算收入與快速小費獎勵
        let earned = cust.price;
        let tip = 0;
        const patienceRatio = cust.currentPatience / cust.maxPatience;
        
        // 若在客人耐心 > 60% 時極速出餐，獎勵 $5 ~ $10 小費！
        if (patienceRatio > 0.6) {
          tip = 6;
          earned += tip;
        }

        dailyRevenue += earned;
        totalCash += earned;
        satisfiedCount++;

        playSfx('cash');
        showFloatingText(`+ $${earned} ${tip > 0 ? '(含小費! 🌟)' : '美味出餐!'}`, "text-yellow-400");

        // 更新介面
        document.getElementById('daily-revenue').innerText = dailyRevenue;
        document.getElementById('total-cash').innerText = totalCash;

        // 客人滿意離隊，下一位補上
        customerQueue.shift();
        currentBoxDishes = [];
        renderPackedBox();
        renderQueue();

        // 補新客人
        if (customerQueue.length < 3) {
          spawnCustomer();
          renderQueue();
        }

      } else {
        // 餸菜點錯了！客人不滿意
        playSfx('angry');
        cust.currentPatience = Math.max(1, cust.currentPatience - 8); // 額外扣減耐心
        showFloatingText("夾錯餸啦！客人唔要呢款！", "text-red-400");
        renderQueue();
      }
    }

    /* ========================================================
       8. 特色功能：一鍵送例湯 (挽回急躁客人耐心)
       ======================================================== */
    function serveFreeSoup() {
      if (!isDayActive) return;
      if (soupCooldownRemaining > 0) {
        showFloatingText(`例湯煲緊中，仲有 ${soupCooldownRemaining} 秒！`, "text-stone-300");
        return;
      }
      if (customerQueue.length === 0) return;

      playSfx('soup');
      // 前排客人耐心值回升 +20
      customerQueue[0].currentPatience = Math.min(customerQueue[0].maxPatience, customerQueue[0].currentPatience + 20);
      showFloatingText("熱辣羅宋/青紅蘿蔔例湯！客人耐心大增！🥣", "text-amber-300");
      
      // 冷卻時間 15 秒
      soupCooldownRemaining = 15;
      updateSoupButton();
      renderQueue();
    }

    function updateSoupButton() {
      const label = document.getElementById('soup-cooldown');
      const btn = document.getElementById('soup-btn');
      if (soupCooldownRemaining > 0) {
        label.innerText = `(${soupCooldownRemaining}s)`;
        btn.classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        label.innerText = "";
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }

    /* ========================================================
       9. 遊戲主迴圈 (每秒跳動計時)
       ======================================================== */
    function gameTick() {
      if (!isDayActive) return;

      // 1. 營業時間倒數
      timeLeft--;
      document.getElementById('timer').innerText = `${timeLeft}s`;

      // 2. 例湯冷卻倒數
      if (soupCooldownRemaining > 0) {
        soupCooldownRemaining--;
        updateSoupButton();
      }

      // 3. 客人耐心消耗
      for (let i = customerQueue.length - 1; i >= 0; i--) {
        const cust = customerQueue[i];
        // 第一位排隊客人消耗較快
        const drain = (i === 0) ? 1 : 0.4;
        cust.currentPatience -= drain;

        if (cust.currentPatience <= 8) {
          cust.isAngry = true;
        }

        // 客人耐心歸零，憤怒拂袖而去！
        if (cust.currentPatience <= 0) {
          playSfx('angry');
          const randomVoice = CANTONESE_ANGRY_VOVoices();
          showFloatingText(`🤬 客人激氣走咗：「${randomVoice}」`, "text-red-500");
          
          // 聲譽受損扣除懲罰金 $10 (若有餘額)
          totalCash = Math.max(0, totalCash - 10);
          document.getElementById('total-cash').innerText = totalCash;

          customerQueue.splice(i, 1);
          // 若走的是當前客人，把手中飯盒也清空以免混亂
          if (i === 0) {
            currentBoxDishes = [];
            renderPackedBox();
          }
        }
      }

      // 4. 定時補充隊列人數
      if (customerQueue.length < 3 && Math.random() < 0.4) {
        spawnCustomer();
      }

      renderQueue();

      // 5. 今日營業時間結束，進行打烊結算
      if (timeLeft <= 0) {
        endBusinessDay();
      }
    }

    function CANTONESE_ANGRY_VOVoices() {
      return CANTONESE_ANGRY_VOICES[Math.floor(Math.random() * CANTONESE_ANGRY_VOICES.length)];
    }

    /* ========================================================
       10. 每日打烊結算與破產判定
       ======================================================== */
    function endBusinessDay() {
      isDayActive = false;
      clearInterval(timerInterval);

      // 計算扣除成本後的純利
      const netProfit = dailyRevenue - dailyCost;
      totalCash += 0; // 已經在每次出餐時即時累加到 totalCash，此處扣除今日總營運成本
      totalCash -= dailyCost;

      const modal = document.getElementById('summary-modal');
      const title = document.getElementById('summary-title');
      const subtitle = document.getElementById('summary-subtitle');
      const sumServed = document.getElementById('sum-customers-served');
      const sumRev = document.getElementById('sum-revenue');
      const sumCost = document.getElementById('sum-cost');
      const sumNet = document.getElementById('sum-net-profit');
      const sumTotal = document.getElementById('sum-total-cash');
      const statusMsg = document.getElementById('summary-status-msg');
      const nextBtn = document.getElementById('next-day-btn');
      const restartBtn = document.getElementById('restart-btn');

      sumServed.innerText = satisfiedCount;
      sumRev.innerText = dailyRevenue;
      sumCost.innerText = dailyCost;
      
      sumNet.innerText = (netProfit >= 0 ? `+$${netProfit}` : `-$${Math.abs(netProfit)}`);
      sumNet.className = netProfit >= 0 ? 'font-black text-green-400' : 'font-black text-red-400';
      sumTotal.innerText = `$${totalCash}`;

      // 判定勝負條件：資金如果低於 0 元 -> 宣告執笠破產！
      if (totalCash < 0) {
        title.innerText = "😭 慘痛執笠 (破產)";
        title.className = "text-3xl font-black text-red-500 mb-1";
        subtitle.innerText = "收入不足以應付昂貴的租金同食材開支...";
        statusMsg.innerHTML = `<span class="text-red-400">你喺第 ${currentDay} 日捱唔住昂貴租金宣布倒閉！共招待過 ${satisfiedCount} 位街坊。下次再接再厲！</span>`;
        nextBtn.classList.add('hidden');
        restartBtn.classList.remove('hidden');
      } else {
        // 成功過關！
        title.innerText = `🎉 第 ${currentDay} 日順利度過！`;
        title.className = "text-3xl font-black text-yellow-400 mb-1 neon-text-yellow";
        subtitle.innerText = "扣除全部成本後仍有盈餘！生意興隆！";
        statusMsg.innerHTML = `<span class="text-green-400">街坊個個讚好！聽日將會有新嘅餸菜同更多客人到訪，繼續努力！</span>`;
        nextBtn.classList.remove('hidden');
        restartBtn.classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    // 邁向下一天
    function startNextDay() {
      document.getElementById('summary-modal').classList.add('hidden');
      currentDay++;
      initializeDay();
    }

    // 破產重開
    function restartEntireGame() {
      document.getElementById('summary-modal').classList.add('hidden');
      currentDay = 1;
      totalCash = 200;
      initializeDay();
    }

    /* ========================================================
       11. 動態畫面上浮文字反饋 (視覺效果)
       ======================================================== */
    function showFloatingText(msg, colorClass = "text-yellow-400") {
      const el = document.createElement('div');
      el.className = `floating-feedback ${colorClass} text-sm sm:text-base drop-shadow-md bg-stone-900/80 px-3 py-1.5 rounded-full border border-stone-600`;
      el.innerText = msg;
      
      // 置於主畫面中央偏上方
      el.style.left = '50%';
      el.style.top = '40%';

      document.body.appendChild(el);
      setTimeout(() => {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 1000);
    }

    // 視窗載入即刻開檔
    window.onload = function () {
      initializeDay();
    };
  </script>
